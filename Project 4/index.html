<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Summary Component</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="card  result">
            <div class="result-text">
                <p class="p1 p ">Your Result</p>
                <div class="cir">
                    <p class="p2 p  ">76</p>
                    <p class="p3 p  ">of 100</p>
                </div>

                <p class="p4 p ">Great</p>
                <p class="p5 p ">You scored higher than 65% of the people who have taken these tests.</p>
                </p>
            </div>

        </div>




        <div class="card summary sp">
            <p class="sp1 ">Summary</p>
            <div class="rec">
                <img  class="ig" src="./assets/images/icon-reaction.svg">
                <p class="sp2 sp">Reaction</p>
                <p class="sp3 sp">80 / 100</p>
            </div>

            <div class="mem sp">
                <img class="ig" src="./assets/images/icon-memory.svg">
                <p class="sp4 sp">Memory</p>
                <p class="sp5 sp">92 / 100</p>
            </div>


            <div class="ver sp">
                <img class="ig" src="./assets/images/icon-verbal.svg">
                <p class="sp6">Verbal</p>
                <p class="sp7">61 / 100</p>
            </div>


            <div class="vis sp">
                <img class="ig" src="./assets/images/icon-visual.svg">
                <p class="sp8 sp"> Visual </p>
                <p class="sp9 sp">72 / 100</p>
            </div>

            <div>
                <p class="sp10 sp button">Continue</p>
            </div>

        </div>
    </div>
</body>

</html>
