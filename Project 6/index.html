<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus on today</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;
        0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;
        1,900&family=Salsa&family=Style+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer> </script>
</head>

<body>
    <main>
        <h1 class=title>
            Focus on <span>Today </span>
        </h1>

        <div class="container">
            <div class="text">
                <p class="to ">Today</p>
                <img src="./images/Sun.png">
            </div>

            <p class="para">Raise the bar by completing your goals!</p>

            <div class="progress-bar">

                <div class="progress-value">
                    <!-- 2/3 Completed -->
                </div>
            </div>
            <div class="error-label">
                Please set all the 3 goals!
            </div>

            <div class="goal-container ">

                <div class="checkbox">
                    <img class="check-icon" src="./images/check.svg">
                </div>

                <input type="text" id="first" class="goal g1 " placeholder="Add new goal...">

            </div>

            <div class="goal-container ">
                <div class="checkbox"><img class="check-icon" src="./images/check.svg"></div>
                <input type="text" id="second" class="goal g2" placeholder="Add new goal...">
            </div>

            <div class="goal-container ">
                <div class="checkbox"><img class="check-icon" src="./images/check.svg"></div>
                <input type="text" id="third" class="goal g3" placeholder="Add new goal...">
            </div>

            <p class="para2">“Move one step ahead, today!”</p>
            <p class="para3">Made with ❤️ by Gaurav Digari</p>
        </div>

    </main>

</body>

</html>
